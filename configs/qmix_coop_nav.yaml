# Configuration for QMIX on Cooperative Navigation

# Environment settings
env:
  name: cooperative_navigation
  num_agents: 3
  num_landmarks: 3
  world_size: 2.0
  max_steps: 100

# Algorithm settings
algorithm:
  name: qmix
  hidden_dim: 128
  mixing_embed_dim: 32

  # Learning rate
  lr: 0.0005

  # Discount and soft update
  gamma: 0.99
  tau: 0.005

  # Epsilon-greedy exploration
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.9995

  # Replay buffer
  buffer_size: 100000
  batch_size: 256

# Training settings
training:
  num_episodes: 10000
  max_steps_per_episode: 100

  # Update frequency
  update_freq: 1

  # Logging
  print_freq: 100
  save_freq: 1000
  render_freq: 500
  render: false

# Output settings
output:
  log_dir: results
  exp_name: qmix_coop_nav
  save_best: true
  use_tensorboard: true

# System settings
system:
  seed: 42
  device: auto
  num_workers: 1
